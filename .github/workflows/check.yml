name: Website checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENT_STORAGE: local
      APP_ORIGIN: http://localhost:3000
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Build public visual preview
        if: github.event_name == 'push'
        run: node scripts/build-visual-preview.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: pixelated-visual-preview
          path: visual-preview/
          retention-days: 14
